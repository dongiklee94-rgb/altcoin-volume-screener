name: Unified Altcoin Screener

on:
  schedule:
    # 매시 정각 직후 실행 (명세서 2-4: 조건 ①이 1시간봉 기준이라 이보다 자주 돌 필요 없음)
    # GitHub 크론은 부하에 따라 5~20분 밀릴 수 있다. 정상이다.
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: unified-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Self test
        run: python unified_screener.py --self-test

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: unified-state-${{ github.run_id }}
          restore-keys: |
            unified-state-

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_STATE_DIR: state
        run: python unified_screener.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: unified-state-${{ github.run_id }}
